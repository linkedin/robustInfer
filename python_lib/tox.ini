[tox]
min_version = 4.0
env_list = py{310,311,312,313}, lint, format
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
deps =
    pytest
extras =
    jax
    # Install with JAX support for complete testing
commands = pytest tests/ -v
# This installs your project with its dependencies automatically

[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:lint]
description = Run linting with ruff
deps = ruff
commands = ruff check src/ tests/
skip_install = true  # Don't install the project for linting

[testenv:format]
description = Format code with ruff
deps = ruff
commands = ruff format src/ tests/
skip_install = true  # Don't install the project for formatting